# Game-сервер (socket.io: dominion + драфт сезона) для деплоя на Render.
# Имя сервиса не меняем, чтобы не orphan-ить уже созданный сервис в Render.
# Netlify хостит только статику фронта — вебсокеты живут здесь.
services:
  - type: web
    name: xaura-monopoly-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: CLIENT_URL
        sync: false
